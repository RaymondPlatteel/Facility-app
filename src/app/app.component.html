<ion-app [class.has-sidebar]="isAuthenticated">

  <!-- Kiosk mode: every kiosk-facing destination (Check In / Waiver /
       Feedback) plus Admin stays reachable — just as a small icon row
       instead of a full labeled/branded top bar. Reachable from every
       kiosk page, not only Home, so there's no dead end on Waiver or
       Feedback with no way back to Check In. -->
  <nav class="kiosk-nav" *ngIf="!isAuthenticated">
    <a class="kiosk-nav-btn" routerLink="/signin" routerLinkActive="active" aria-label="Check In">
      <ion-icon name="log-in-outline"></ion-icon>
    </a>
    <a class="kiosk-nav-btn" routerLink="/waiver" routerLinkActive="active" aria-label="Waiver">
      <ion-icon name="document-text-outline"></ion-icon>
    </a>
    <a class="kiosk-nav-btn" routerLink="/feedback" routerLinkActive="active" aria-label="Feedback">
      <ion-icon name="chatbubbles-outline"></ion-icon>
    </a>
    <button class="kiosk-nav-btn kiosk-nav-btn--admin" (click)="openKeypad()" aria-label="Admin">
      <ion-icon name="keypad-outline"></ion-icon>
    </button>
  </nav>

  <!-- Admin mode, phone width: one consolidated top bar — hamburger (Home
       only) or back arrow (everywhere else) on the left, the real page
       title next to it, and whatever "+ New X" action the current page
       registered (see TopBarActionService) on the right. The persistent
       sidebar becomes a slide-in drawer, opened from Home's hamburger;
       desktop/tablet keeps the always-on sidebar untouched — see the
       max-width: 768px rule in app.component.scss. -->
  <div class="mobile-topbar" *ngIf="isAuthenticated">
    <button class="mobile-menu-btn" (click)="onTopBarLeftButton()" [attr.aria-label]="isHomeRoute ? 'Open menu' : 'Back'">
      <ion-icon [name]="isHomeRoute ? 'menu-outline' : 'arrow-back'"></ion-icon>
    </button>
    <!-- The real page title (from the route's data.title) — each page's
         own on-screen title is hidden on mobile so this is the only one,
         not a second title stacked below an empty bar. -->
    <span class="mobile-topbar-brand">{{ pageTitle }}</span>
    <button class="mobile-topbar-action" *ngIf="topBarAction" (click)="topBarAction.onClick()">
      <ion-icon [name]="topBarAction.icon"></ion-icon>
      <span>{{ topBarAction.label }}</span>
    </button>
  </div>
  <div class="sidebar-backdrop" *ngIf="isAuthenticated && mobileMenuOpen" (click)="closeMobileMenu()"></div>

  <!-- Admin mode: signed-in coach — standard dashboard sidebar. Always on
       screen on desktop/tablet (no hover/tap-to-open overlay — that was
       tried before and caused more broken navigation than it solved). On
       phone width it's the same markup, but becomes the slide-in drawer
       the hamburger above toggles — see .mobile-open in the stylesheet. -->
  <aside class="app-sidebar" *ngIf="isAuthenticated" [class.mobile-open]="mobileMenuOpen">
    <a routerLink="/home" class="sidebar-brand">
      <span class="brand-name">Project [000]</span>
    </a>

    <div class="sidebar-links">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="sidebar-link">
        <ion-icon name="home-outline"></ion-icon>
        <span>Home</span>
      </a>
      <a routerLink="/live-session" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="pulse-outline"></ion-icon>
        <span>Live Session</span>
      </a>

      <div class="sidebar-group-title">Manage</div>
      <a routerLink="/students" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="people-outline"></ion-icon>
        <span>Clients</span>
      </a>
      <a routerLink="/programs" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="fitness-outline"></ion-icon>
        <span>Programs</span>
      </a>
      <a routerLink="/packages" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="cube-outline"></ion-icon>
        <span>Packages</span>
      </a>
      <a routerLink="/jobs" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="briefcase-outline"></ion-icon>
        <span>Jobs</span>
      </a>

      <div class="sidebar-group-title">Track</div>
      <a routerLink="/assessments" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="trending-up-outline"></ion-icon>
        <span>Assessments</span>
      </a>
      <a routerLink="/workout-log" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="barbell-outline"></ion-icon>
        <span>Workout Log</span>
      </a>
      <a routerLink="/fit-analyzer" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="speedometer-outline"></ion-icon>
        <span>FIT Analyzer</span>
      </a>

      <div class="sidebar-group-title">Business</div>
      <a routerLink="/schedule" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>Schedule</span>
      </a>
      <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="analytics-outline"></ion-icon>
        <span>Admin Analytics</span>
      </a>
      <a routerLink="/feedback-admin" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <span>Feedback</span>
      </a>
      <a routerLink="/pending-assessments" routerLinkActive="active" class="sidebar-link sidebar-link--pending">
        <ion-icon name="notifications-outline"></ion-icon>
        <span>Pending</span>
        <span class="nav-badge" *ngIf="pendingReviewCount > 0">{{ pendingReviewCount }}</span>
      </a>

      <div class="sidebar-group-title">System</div>
      <a routerLink="/signin" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="log-in-outline"></ion-icon>
        <span>Kiosk Mode</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active" class="sidebar-link">
        <ion-icon name="settings-outline"></ion-icon>
        <span>Settings</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <span class="nav-trainer" *ngIf="currentTrainer">
        <ion-icon name="person-circle-outline"></ion-icon>
        {{ currentTrainer.name }}
      </span>
      <button class="nav-btn nav-btn--lock" (click)="lockApp()">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <span>Lock</span>
      </button>
    </div>
  </aside>

  <div class="app-content">
    <ion-router-outlet></ion-router-outlet>
  </div>

  <!-- Admin PIN keypad (global) -->
  <ion-modal class="keypad-modal" [isOpen]="keypadOpen" (didDismiss)="closeKeypad()">
    <ng-template>
      <div class="keypad-container">
        <button class="keypad-close" (click)="closeKeypad()" aria-label="Close">
          <ion-icon name="close"></ion-icon>
        </button>
        <div class="passcode-display">
          <div class="keypad-title">Admin Access</div>
          <div class="passcode-dots">
            <div
              *ngFor="let dot of [1,2,3,4]; let i = index"
              class="dot"
              [class.filled]="i < enteredCode.length"
              [class.error]="showError">
            </div>
          </div>
          <div class="error-message" [class.visible]="showError">
            Incorrect passcode
          </div>
        </div>

        <div class="keypad-grid">
          <button
            *ngFor="let num of [1,2,3,4,5,6,7,8,9,null,0,'clear']"
            class="keypad-btn"
            [class.disabled]="num === null"
            (click)="onKeypadPress(num)"
            [disabled]="num === null">
            <span *ngIf="num !== null && num !== 'clear'">{{ num }}</span>
            <ion-icon *ngIf="num === 'clear'" name="backspace-outline"></ion-icon>
          </button>
        </div>
      </div>
    </ng-template>
  </ion-modal>
</ion-app>
