<ion-content [fullscreen]="true">
  <div class="ann-container">
    <div class="ann-header">
      <h2>Announcements</h2>
      <p class="subtitle">Shown at the top of the World page in the athlete app.</p>
    </div>

    <section class="ann-card">
      <h3>Prize pool banner</h3>
      <p class="hint">Leave the prize pool empty to hide the banner.</p>
      <div class="ann-grid">
        <label>
          <span>Prize pool (USD)</span>
          <input type="number" inputmode="numeric" min="0" [(ngModel)]="prizePool" placeholder="e.g. 100000" />
        </label>
        <label>
          <span>Event start</span>
          <input type="date" [(ngModel)]="eventDate" />
        </label>
        <label>
          <span>Event end (optional)</span>
          <input type="date" [(ngModel)]="eventEndDate" />
        </label>
        <label class="wide">
          <span>Label</span>
          <input type="text" [(ngModel)]="label" placeholder="e.g. OMPAR Open" />
        </label>
      </div>
      <button class="ann-btn" [disabled]="isSavingBanner" (click)="saveBanner()">{{ isSavingBanner ? 'Saving…' : 'Save banner' }}</button>
    </section>

    <section class="ann-card">
      <h3>New announcement</h3>
      <label>
        <span>Title</span>
        <input type="text" [(ngModel)]="title" maxlength="120" placeholder="Headline" />
      </label>
      <label>
        <span>Message</span>
        <textarea rows="5" [(ngModel)]="body" placeholder="What do you want every competitor to see?"></textarea>
      </label>
      <button class="ann-btn" [disabled]="!canPost" (click)="post()">{{ isPosting ? 'Posting…' : 'Post announcement' }}</button>
    </section>

    <section class="ann-card">
      <h3>Posted</h3>
      <p *ngIf="isLoading" class="hint">Loading…</p>
      <p *ngIf="!isLoading && !announcements.length" class="hint">Nothing posted yet.</p>
      <div *ngFor="let a of announcements; let i = index" class="ann-item">
        <div class="ann-item-main">
          <div class="ann-item-title">{{ a.title }} <span *ngIf="i === 0" class="pinned">pinned</span></div>
          <div class="ann-item-body">{{ a.body }}</div>
          <div class="ann-item-date">{{ a.createdAt | date:'MMM d, y · h:mm a' }}</div>
        </div>
        <button class="icon-btn" (click)="remove(a)" aria-label="Delete"><ion-icon name="trash-outline"></ion-icon></button>
      </div>
    </section>
  </div>
</ion-content>
